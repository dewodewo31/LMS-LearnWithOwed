# LearnWithOwed Production Stack
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Services:
#   mongo    - MongoDB 7
#   server   - Express API (production build)
#   client   - React SPA served by nginx

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # No port binding — internal only

  server:
    build:
      context: ./server
      target: production
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/kn-lms
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRES=15m
      - JWT_REFRESH_EXPIRES=7d
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - UPLOAD_PATH=./uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      target: production
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
  uploads_data:
